<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Directory — AutoHelper</title>
  <link rel="stylesheet" href="/artists-dashboard/static/shared.css">
</head>
<body>
  <div id="app">
    <nav class="artist-nav">
      <a href="/artists-settings" class="nav-link">Settings</a>
      <a href="/artists-health" class="nav-link">Health</a>
      <a href="/artists-recon" class="nav-link">Reconciliation</a>
      <a href="/artists-dashboard" class="nav-link active">Directory</a>
    </nav>

    <header class="header">
      <h1>Artist Directory</h1>
      <div class="header-actions">
        <button id="btn-reload" class="btn btn-ghost" title="Reload data">&#x27F3; Reload</button>
      </div>
    </header>

    <!-- Search bar with prefix syntax help -->
    <div class="toolbar">
      <input type="text" id="search" class="search-input" placeholder="Search: name, identity:tag, project:name, city:name, category:type, score:<40">
      <button id="btn-clear-filters" class="btn btn-ghost">Clear</button>
      <div class="toolbar-spacer"></div>
      <span id="result-count" class="result-count"></span>
    </div>

    <!-- Pill filters -->
    <div id="category-pills" class="pill-filters"></div>

    <!-- Main layout -->
    <div class="main-layout">
      <div class="table-wrap">
        <table id="artist-table" class="artist-table">
          <thead>
            <tr>
              <th data-sort="display_name" class="sortable">Artist <span class="sort-icon"></span></th>
              <th>Categories</th>
              <th data-sort="primary_identity" class="sortable">Identity <span class="sort-icon"></span></th>
              <th data-sort="completeness" class="sortable">Score <span class="sort-icon"></span></th>
              <th data-sort="gap_count" class="sortable">Gaps <span class="sort-icon"></span></th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="artist-tbody"></tbody>
        </table>
      </div>

      <!-- Detail overlay + panel -->
      <div id="detail-overlay" class="detail-overlay hidden"></div>
      <aside id="detail-panel" class="detail-panel hidden">
        <div class="detail-header">
          <span id="detail-title" class="detail-title"></span>
          <button id="detail-close" class="detail-close">&times;</button>
        </div>
        <div id="detail-body" class="detail-body"></div>
      </aside>
    </div>
  </div>

  <script src="/artists-dashboard/static/nav.js"></script>
  <script src="/artists-dashboard/static/app.js"></script>
</body>
</html>
